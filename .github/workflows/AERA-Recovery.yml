name: AERA Recovery [AERA]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'AERA Manifest Branch'
        required: true
        default: 'aera-16.0'
        type: choice
        options:
        - aera-16.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' # Your already made Device Tree
        required: true
        default: 'https://github.com/Kyros70/android_device_freeyond_m5a-recovery'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' # Your Device Tree Branch, make sure it's right.
        required: true
        default: 'AERA'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/chinoe/M5A'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'M5A'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (excluding .mk extension, Example: twrp_M5A)'
        required: true
        default: 'twrp_M5A'
      RELEASE:
        description: 'Android build release used by lunch (bp2a for Android 16)'
        required: true
        default: 'bp2a'
      BUILD_TYPE:
        description: 'Build variant used by lunch'
        required: true
        default: 'eng'
        type: choice
        options:
        - eng
        - userdebug
      BUILD_TARGET:
        description: 'Specify your Build Target' # Pick among boot, recovery and vendorboot
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build AERA by ${{ github.actor }}
    runs-on: namespace-profile-speed 
    if: github.event.repository.owner.id == github.event.sender.id
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AERA_ROOT: ${{ github.workspace }}/android-recovery
      OUTPUT_DIR: ${{ github.workspace }}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v6

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Prepare the environment
      run: |
        sudo apt-get update
        PKGS="aria2 ccache python3 python-is-python3 bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip patch git"
        INSTALL=""
        for p in $PKGS; do
            if apt-cache show "$p" > /dev/null 2>&1; then
                INSTALL="$INSTALL $p"
            else
                echo "Skipping $p, not available on this Ubuntu release"
            fi
        done
        sudo apt-get -y install $INSTALL

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Git-Repo
      run: |
        curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
        sudo install -m 0755 /tmp/repo /usr/local/bin/repo
        sudo ln -sf /usr/local/bin/repo /usr/bin/repo
        repo --version | head -n 3

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"

    - name: Initialize Repo
      run: |
        mkdir android-recovery
        cd android-recovery
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b ${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        cd android-recovery
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
        version="$(sed -nE 's/^[[:space:]]*AERA_INTERNAL_RELEASE[[:space:]]*:?=[[:space:]]*//p' bootable/recovery/aera_build.mk | head -n1)"
        echo "AERA_VERSION_NAME=${version:-unknown}" >> $GITHUB_ENV

    - name: Clone Device Tree
      run: |
        set -euo pipefail
        cd android-recovery
        git clone --depth=1 --single-branch --branch "${{ inputs.DEVICE_TREE_BRANCH }}" "${{ inputs.DEVICE_TREE }}" "./${{ inputs.DEVICE_PATH }}"
        cd "${{ inputs.DEVICE_PATH }}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Skip unavailable GSI keys product makefile
      run: |
        set -euo pipefail
        product_mk="${{ env.AERA_ROOT }}/${{ inputs.DEVICE_PATH }}/${{ inputs.MAKEFILE_NAME }}.mk"
        test -f "$product_mk" || { echo "::error::Device product makefile not found: $product_mk"; exit 1; }
        if grep -q 'product/gsi_keys.mk' "$product_mk"; then
            sed -i '/product\/gsi_keys\.mk/d' "$product_mk"
            sed -i '/Installs gsi keys into ramdisk/d' "$product_mk"
        fi
        if grep -q 'product/gsi_keys.mk' "$product_mk"; then
            echo "::error::Failed to remove unavailable gsi_keys.mk inheritance"
            exit 1
        fi
        echo "Skipped optional GSI keys inheritance for recovery build"

    - name: Allow the device Android version in the CTS platform files
      run: |
        set -euo pipefail
        board_config="${{ env.AERA_ROOT }}/${{ inputs.DEVICE_PATH }}/BoardConfig.mk"
        test -f "$board_config" || { echo "::error::BoardConfig.mk not found: $board_config"; exit 1; }

        platform_version="$(sed -nE 's/^[[:space:]]*PLATFORM_VERSION[[:space:]]*:?=[[:space:]]*([^#[:space:]]+).*/\1/p' "$board_config" | tail -n1)"
        stable_version="$(sed -nE 's/^[[:space:]]*PLATFORM_VERSION_LAST_STABLE[[:space:]]*:?=[[:space:]]*([^#[:space:]]+).*/\1/p' "$board_config" | tail -n1)"

        if [ -z "$platform_version" ]; then
            echo "::error::PLATFORM_VERSION is not defined in $board_config"
            exit 1
        fi
        if [ -z "$stable_version" ] || [ "$stable_version" = '$(PLATFORM_VERSION)' ]; then
            stable_version="$platform_version"
        fi

        cd "${{ env.AERA_ROOT }}/cts/tests/tests/os/assets"
        for f in platform_versions.txt platform_releases.txt; do
            grep -Fqx "$platform_version" "$f" || printf '\n%s\n' "$platform_version" >> "$f"
            grep -Fqx "$stable_version" "$f" || printf '\n%s\n' "$stable_version" >> "$f"
        done
        echo "CTS platform entries added: PLATFORM_VERSION=$platform_version, PLATFORM_VERSION_LAST_STABLE=$stable_version"
        tail -n 5 platform_versions.txt platform_releases.txt

    - name: Building Image
      run: |
        cd android-recovery
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export AERA_MAINTAINER="Kyros70"
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        set -e
        lunch ${{ inputs.MAKEFILE_NAME }}-${{ inputs.RELEASE }}-${{ inputs.BUILD_TYPE }}
        mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ inputs.BUILD_TARGET }}.img"

    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if the recovery exists
      if: always()
      run: |
        case "${{ inputs.BUILD_TARGET }}" in
            vendorboot) img_name="vendor_boot.img" ;;
            *) img_name="${{ inputs.BUILD_TARGET }}.img" ;;
        esac
        img_file="${{ env.OUTPUT_DIR }}/$img_name"
        if [ -f "$img_file" ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "IMG_NAME=$img_name" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$img_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "::warning::$img_name is not in the out directory, the build did not finish"
        fi

    - name: Compress image
      if: env.CHECK_IMG_IS_OK == 'true'
      run: |
        cd "${{ env.OUTPUT_DIR }}"
        xz -9e -T0 -k -v -f -c "${{ env.IMG_NAME }}" > "${{ env.IMG_NAME }}.xz"

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/${{ env.IMG_NAME }}
          ${{ env.OUTPUT_DIR }}/${{ env.IMG_NAME }}.xz
        name: AERA for ${{ inputs.DEVICE_NAME }} (Unofficial)
        tag_name: ${{ github.run_id }}
        body: |
          Build: AERA ${{ env.AERA_VERSION_NAME }} (${{ inputs.MANIFEST_BRANCH }})
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
        prerelease: true

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root/
        cd ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
