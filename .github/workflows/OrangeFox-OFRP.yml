name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/SPEEDFIRE7/android_recovery_oppo_CPH2185'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch (use master if default)'
        required: true
        default: 'OFOX'
      DEVICE_NAME:
        description: 'Specify your Device Codename' # As is, just like your PRODUCT_DEVICE in your device tree.
        required: true
        default: 'CPH2185'
      DEVICE_PATH:
        description: 'Specify your Device Path (Check the DEVICE_PATH in BoardConfig.mk)' # As is, just like your DEVICE_PATH in your BoardConfig.mk
        required: true
        default: 'device/oppo/CPH2185'
      BUILD_TARGET:
        description: 'Specify your Build Target' # The image suffix will be added later in build step.
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: namespace-profile-speed
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      OUTPUT_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}

    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"
      
    - name: Set-up Manifest # For github workspace use single {}
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      
    - name: Clone Device Tree
      run: |
        cd ${{ env.ORANGEFOX_ROOT }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        # OFRP-only safeguard: remove the legacy duplicate build-date property
        # from this device tree before generating Android product properties.
        if grep -RIl --include='*.mk' 'ro.build.date.utc=1230768000' .; then
          grep -RIl --include='*.mk' 'ro.build.date.utc=1230768000' . | while IFS= read -r file; do
            sed -i '/ro\.build\.date\.utc[[:space:]]*=[[:space:]]*1230768000/d' "$file"
          done
        fi
        if grep -RIn --include='*.mk' 'ro.build.date.utc=1230768000' .; then
          echo "::error::Legacy duplicate ro.build.date.utc assignment remains in OFRP device tree"
          exit 1
        fi

    - name: Building OrangeFox
      shell: bash
      run: |
        # Android/OrangeFox envsetup scripts rely on unset shell variables.
        # Do not enable nounset (-u) while sourcing or running the build system.
        set -eo pipefail
        # Explicitly keep nounset disabled: Android/OrangeFox envsetup and lunch
        # intentionally read variables before they are initialized.
        set +u
        pushd "${{ env.ORANGEFOX_ROOT }}"
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export ALLOW_MISSING_DEPENDENCIES=true

        # Disable Soong's Linux sandbox check on the hosted runner.
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go

        set +e
        set +u
        source build/envsetup.sh
        ENVSETUP_STATUS=$?
        set -e
        set +u
        echo "envsetup.sh exit status: ${ENVSETUP_STATUS}"
        if ! declare -F lunch >/dev/null 2>&1; then
          echo "::error::build/envsetup.sh did not define the lunch function"
          exit 1
        fi

        BUILD_OUTPUT_TARGET="${{ inputs.BUILD_TARGET }}"
        echo "Building requested target: ${BUILD_OUTPUT_TARGET}image"
        echo "BUILD_OUTPUT_TARGET=${BUILD_OUTPUT_TARGET}" >> "$GITHUB_ENV"

        set +e
        lunch "twrp_${{ inputs.DEVICE_NAME }}-eng"
        LUNCH_STATUS=$?
        set -e
        set +u
        echo "lunch exit status: ${LUNCH_STATUS}"
        if [ "$LUNCH_STATUS" -ne 0 ]; then
          echo "::error::lunch failed for twrp_${{ inputs.DEVICE_NAME }}-eng"
          exit "$LUNCH_STATUS"
        fi

        # OFRP-only fix: the generic rootfs contains /vendor as a symlink to
        # /system/vendor, while recovery modules are installed into the real
        # recovery/root/vendor directory. Exclude only the source root symlink
        # during the root-to-recovery rsync so it cannot replace that directory.
        MAKEFILE="build/make/core/Makefile"
        python3 - "$MAKEFILE" <<'PY'
        import pathlib, sys
        path = pathlib.Path(sys.argv[1])
        data = path.read_text()
        old = "rsync -a --exclude=sdcard "
        new = "rsync -a --exclude=sdcard --exclude=/root/vendor "
        if new in data:
            print("OFRP /vendor rsync exclusion already present")
        elif data.count(old) == 1:
            path.write_text(data.replace(old, new, 1))
            print("Added OFRP recovery-root /vendor rsync exclusion")
        else:
            raise SystemExit("Expected exactly one recovery rsync command; refusing unsafe patch")
        PY
        grep -nF 'rsync -a --exclude=sdcard --exclude=/root/vendor' "$MAKEFILE"

        make clean
        mka adbd "${BUILD_OUTPUT_TARGET}image"
        popd

    - name: Set Build Date # Build date in UTC
      run: |
        echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if the recovery image exists
      if: success()
      run: |
        set -e
        img_file="${{ env.OUTPUT_DIR }}/${{ inputs.BUILD_TARGET }}.img"
        zip_file=$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -type f -name "OrangeFox*.zip" -print -quit)

        if [ -f "$img_file" ]; then
            output_img="${{ env.OUTPUT_DIR }}/OrangeFox-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img"
            cp -f "$img_file" "$output_img"
            echo "OUTPUT_IMAGE_NAME=OrangeFox-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img" >> "$GITHUB_ENV"
            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "MD5_IMG=$(md5sum "$output_img" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
            ls -lh "$output_img"
        else
            echo "::error::Expected image not found: $img_file"
            echo "Output directory contents:"
            find "${{ env.OUTPUT_DIR }}" -maxdepth 2 -type f -printf '%p (%s bytes)\\n' | head -100
            exit 1
        fi

        if [ -f "$zip_file" ]; then
            echo "CHECK_ZIP_IS_OK=true" >> "$GITHUB_ENV"
            echo "MD5_ZIP=$(md5sum "$zip_file" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
        else
            echo "::warning::OrangeFox installer ZIP was not generated; the boot/recovery image will still be uploaded."
        fi

    - name: Upload recovery image artifact
      if: always() && env.CHECK_IMG_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: |
          ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_IMAGE_NAME }}
          ${{ env.OUTPUT_DIR }}/OrangeFox*.zip
        if-no-files-found: error
        retention-days: 14

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_IMAGE_NAME }}
          ${{ env.OUTPUT_DIR }}/OrangeFox*.tar
          ${{ env.OUTPUT_DIR }}/OrangeFox*.zip
          ${{ env.OUTPUT_DIR }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
        prerelease: true

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/
        cd ${GITHUB_WORKSPACE}/${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
